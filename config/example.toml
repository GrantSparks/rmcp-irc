[irc]
host = "irc"
port = 6667
transport = "plain"

# Reference secrets through environment variables; do not store values here.
# server_password = { env = "ERGO_SERVER_PASSWORD" }
# sasl = { username = "guest", password = { env = "ERGO_SASL_PASSWORD" } }

[onboarding]
nickname_instruction = "Choose a nickname based on a mythological character."
username_template = "mcp-{agent_id}"
real_name_template = "rmcp-irc guest {nickname}"
initial_channels = []
nickname_attempts = 8
connect_timeout_ms = 15000

[reconnect]
initial_delay_ms = 500
max_delay_ms = 30000
multiplier = 2.0
jitter = 0.2

[limits]
max_agents = 64
command_queue = 256
pending_commands = 128
active_batches = 64
replies_per_command = 512
event_count = 4096
event_bytes = 4194304
max_line_bytes = 8192
max_message_bytes = 65536
max_message_parts = 256
max_command_timeout_ms = 30000
max_event_wait_ms = 30000
max_event_page_size = 1000

[mcp]
# Require an answered confirmation before irc.kick or irc.message.redact is
# written upstream. Off by default. With it on, those two calls first return an
# input_required question stating the exact action, apply nothing until the
# answer arrives, and are refused outright for a request that declared no
# form-mode elicitation — a gate that could be bypassed by not declaring a
# capability would not be a gate.
confirm_destructive = false

# Attach the bounded unread hint to successful tool results that name an agent:
# per-watched-target counts, the caller-owned anchor they are measured from, and
# the stream's latest position. On by default, because for a host that does not
# subscribe — or subscribes without starting a model turn — this is the only way
# news reaches the model without spending a whole turn on a long poll. It moves
# no cursor and no watch. Turn it off only for a deployment whose own delivery
# loop is enough; a subscription is not a reason, since it proves a host can be
# woken and nothing about whether it will think. One agent can opt out on its
# own through `activity` on irc.connect.
activity_hints = true

[dcc]
bind_address = "0.0.0.0"
# Set this when automatic route discovery is not reachable by DCC peers.
# advertised_address = "10.0.0.5"
port_start = 50000
port_end = 50100
# Seeds the single default receive root named "downloads" when no
# [[dcc.receive_roots]] table is declared below.
download_directory = "downloads"
max_sessions = 16
max_offers_per_peer = 4
transfer_buffer_bytes = 65536
max_transfer_bytes = 1073741824
# Retain incoming offers and listener-backed outbound offers for this long.
offer_ttl_ms = 120000
# Bound active TCP connects to endpoints advertised by peers.
connect_timeout_ms = 15000
idle_timeout_ms = 300000
automatic_accept_chat = false
automatic_accept_send = false
allow_private_addresses = false
chat_queue = 64
chat_line_bytes = 8192

# Named directories incoming DCC files may be received into. These are the
# complete filesystem authority of the gateway: `irc.dcc.accept` names a root and
# a path relative to it, and can never reach outside one. Declaring any root
# replaces the default seeded from `download_directory`; leave the tables out to
# keep exactly one root named "downloads".
#
# With more than one root declared, an `irc.dcc.accept` call that names none is
# answered with an `input_required` elicitation offering exactly these names.
# Automatic acceptance uses the first root, because nobody is there to choose.
#
# Names are 1-64 characters of letters, digits, '_', '-', or '.', and must be
# unique regardless of case.
# [[dcc.receive_roots]]
# name = "downloads"
# path = "downloads"
#
# [[dcc.receive_roots]]
# name = "media"
# path = "/srv/media/incoming"
