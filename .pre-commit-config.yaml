minimum_pre_commit_version: "3.2.0"
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: fmt
        name: cargo fmt
        entry: cargo fmt
        language: system
        args: ["--all", "--", "--check"]
        stages: [pre-commit, pre-push]
        always_run: true
        types: [rust]
        pass_filenames: false
      - id: clippy
        name: cargo clippy
        entry: cargo clippy
        language: system
        args: ["--all-targets", "--all-features", "--locked", "--", "-D", "warnings"]
        stages: [pre-push]
        always_run: true
        pass_filenames: false
      - id: test
        name: cargo test
        entry: cargo test
        language: system
        args: ["--all-targets", "--all-features", "--locked"]
        stages: [pre-push]
        always_run: true
        pass_filenames: false
      - id: docs
        name: cargo doc
        entry: bash
        language: system
        args:
          - -c
          - RUSTDOCFLAGS="-D warnings" cargo doc --all-features --no-deps --document-private-items --locked
        stages: [pre-push]
        always_run: true
        pass_filenames: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: fix-byte-order-marker
        stages: [pre-commit]
      - id: check-case-conflict
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-symlinks
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: mixed-line-ending
        stages: [pre-commit]
      - id: trailing-whitespace
        stages: [pre-commit]
